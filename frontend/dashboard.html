<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Cloud Storage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>My Cloud Storage</h2>
    <button class="logout">Logout</button>
</header>


<div class="dashboard-card">
    <input type="file">
    <button class="upload-btn">Upload File</button>

    <h3 style="margin-top:30px;">Your Files</h3>

    <table>
        <tr>
            <th>File Name</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>sample.pdf</td>
            <td>
                <button class="file-action-btn">Download</button>
                <button class="file-action-btn">Delete</button>
            </td>
        </tr>
    </table>
</div>

<script src="js/app.js"></script>
</body>
</html>
