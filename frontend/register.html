<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Register | Cloud Storage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-box" id="authBox">
    <h2>Register</h2>
    <form id="registerForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="login.html">Login</a></p>
</div>

<!-- Loader (initially hidden) -->
<div id="loader-wrapper" style="display: none;">
    <div class="card">
        <div class="loader">
            <p>loading</p>
            <div class="words">
                <span class="word">buttons</span>
                <span class="word">forms</span>
                <span class="word">switches</span>
                <span class="word">cards</span>
                <span class="word">buttons</span>
            </div>
        </div>
    </div>
</div>

<script src="css/js/app.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const name = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  fetch("http://localhost:5000/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Full response:", data);
    if (data.token) {
      console.log("Token present, hiding form and showing loader");
      document.getElementById("authBox").style.display = "none";
      const loader = document.getElementById("loader-wrapper");
      loader.style.display = "flex";
      loader.classList.add("fade-in");

      localStorage.setItem("token", data.token);
      localStorage.setItem("userName", data.user.name);
      console.log("Redirecting to dashboard in 4 seconds");
      setTimeout(() => {
        console.log("Redirecting now");
        window.location.href = "dashboard.html";
      }, 4000);
    } else {
      console.log("No token, alerting:", data.message);
      alert(data.message || "Registration failed");
    }
  })
  .catch(err => {
    console.error("Error:", err);
    alert("Server error");
  });
});
</script>
</body>
</html>
